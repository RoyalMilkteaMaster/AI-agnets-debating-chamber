    function 設定文字(識別, 內容) {
      document.getElementById(識別).textContent = 內容 || "—";
    }

    function 建立欄位(名稱, 內容) {
      const 標題 = document.createElement("dt");
      標題.textContent = 名稱;
      const 值 = document.createElement("dd");
      值.textContent = 內容 || "—";
      return [標題, 值];
    }

    function 更新頁面(資料) {
      document.documentElement.dataset.reportStatus = 資料.報告狀態 || "in-progress";
      document.title = `${資料.顯示名稱 || "未命名工作"}｜工作進度`;
      設定文字("顯示名稱", 資料.顯示名稱);
      設定文字("工作識別碼", 資料.工作識別碼);
      設定文字("總進度", `${資料.完成數 || 0}／${資料.總數 || 0} Tickets 完成`);
      設定文字("目前工作", 資料.目前工作);
      設定文字("目前階段", 資料.目前階段);
      設定文字("最後更新", 資料.最後更新);
      document.getElementById("進度條").style.width = `${資料.完成比例 || 0}%`;

      const 票卡列表 = document.getElementById("票卡列表");
      票卡列表.replaceChildren();
      if (!資料.Tickets || 資料.Tickets.length === 0) {
        const 空白 = document.createElement("p");
        空白.className = "空白";
        空白.textContent = "目前沒有可讀取的 Ticket。";
        票卡列表.appendChild(空白);
      } else {
        for (const Ticket of 資料.Tickets) {
          const 卡片 = document.createElement("article");
          卡片.className = "票卡";
          const 標頭 = document.createElement("div");
          標頭.className = "票卡標頭";
          const 標題 = document.createElement("h3");
          標題.textContent = `${Ticket.編號}｜${Ticket.名稱}`;
          const 狀態 = document.createElement("span");
          狀態.className = `狀態 ${String(Ticket.狀態 || "").replaceAll(" ", "")}`;
          狀態.textContent = Ticket.狀態 || "未知";
          標頭.append(標題, 狀態);
          const 欄位 = document.createElement("dl");
          欄位.className = "欄位";
          for (const [名稱, 內容] of [
            ["對應原始需求", Ticket.原始需求],
            ["Ticket 目的", Ticket.目標],
            ["目前紀錄", Ticket.目前紀錄],
            ["測試與 Review", Ticket.驗收摘要],
            ["品味評分", Ticket.品味評分],
            ["範圍與複雜度", Ticket.範圍警示],
            ["下一步", Ticket.下一步],
          ]) {
            欄位.append(...建立欄位(名稱, 內容));
          }
          卡片.append(標頭, 欄位);
          票卡列表.appendChild(卡片);
        }
      }

      const 阻擋區 = document.getElementById("阻擋區");
      const 阻擋列表 = document.getElementById("阻擋列表");
      阻擋列表.replaceChildren();
      阻擋區.hidden = !資料.阻擋 || 資料.阻擋.length === 0;
      for (const 內容 of 資料.阻擋 || []) {
        const 卡片 = document.createElement("div");
        卡片.className = "阻擋卡";
        卡片.textContent = 內容;
        阻擋列表.appendChild(卡片);
      }

      const 歷史區 = document.getElementById("歷史區");
      const 歷史列表 = document.getElementById("歷史列表");
      歷史列表.replaceChildren();
      歷史區.hidden = !資料.歷史報告 || 資料.歷史報告.length === 0;
      for (const 報告 of 資料.歷史報告 || []) {
        const 項目 = document.createElement("li");
        const 連結 = document.createElement("a");
        連結.href = location.protocol === "file:" ? 報告.本機連結 : 報告.連結;
        連結.textContent = 報告.名稱;
        項目.appendChild(連結);
        歷史列表.appendChild(項目);
      }
    }

    更新頁面(初始資料);

    if (location.protocol === "http:" || location.protocol === "https:") {
      const 連線狀態 = document.getElementById("連線狀態");
      const 事件來源 = new EventSource("/events");
      事件來源.addEventListener("progress", (事件) => 更新頁面(JSON.parse(事件.data)));
      事件來源.onopen = () => {
        連線狀態.className = "連線";
        連線狀態.textContent = "已連線，進度會非同步更新";
      };
      事件來源.onerror = () => {
        連線狀態.className = "連線 離線";
        連線狀態.textContent = "連線中斷，畫面保留最後進度";
      };
    }
  </script>
